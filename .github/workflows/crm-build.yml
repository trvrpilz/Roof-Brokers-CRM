name: CRM Backend Build
on:
  push:
    branches:
      - main
      - test-lead-role-isolation
  pull_request:
    paths:
      - 'Dockerfile'
      - '.staging/**'
      - 'railway/migrations/**'
      - '.github/workflows/crm-build.yml'
      - 'tests/role_access_runtime.py'
  workflow_dispatch:
jobs:
  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build CRM container and validate runtime patches
        run: docker build --progress=plain --tag roof-brokers-crm:ci .
      - name: Test owner and representative permissions without live data
        run: docker run --rm --entrypoint python -v "$PWD/tests:/tests:ro" roof-brokers-crm:ci /tests/role_access_runtime.py
